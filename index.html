<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JARVIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070e">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070e;
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;z-index:20;background:transparent;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:30}
  #ui .top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;right:14px;
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  #j-status{font:500 11px/1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;
    color:#9fdcff;background:rgba(8,30,60,.45);border:1px solid rgba(120,205,255,.35);
    border-radius:999px;padding:7px 12px;display:flex;align-items:center;gap:7px;backdrop-filter:blur(8px)}
  #j-status .dot{width:7px;height:7px;border-radius:50%;background:#f4b64a;box-shadow:0 0 9px currentColor}
  #j-status.on .dot{background:#57e39a}
  .btn{pointer-events:auto;border-radius:999px;border:1px solid rgba(120,205,255,.35);
    background:rgba(8,30,60,.45);color:#9fdcff;backdrop-filter:blur(8px);cursor:pointer;
    font:500 12px/1 system-ui;padding:9px 14px}
  .btn:active{transform:scale(.97)}
  #j-gear{width:36px;height:36px;padding:0;font-size:16px}
  #j-bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
    display:flex;justify-content:center;gap:10px}
  #j-fx.off{color:#8794a0;border-color:rgba(140,150,160,.35)}
  #j-modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;
    justify-content:center;pointer-events:auto;z-index:40;padding:20px}
  #j-modal.show{display:flex}
  #j-modal .box{background:#0a1622;border:1px solid rgba(120,205,255,.35);border-radius:14px;
    padding:18px;width:min(94vw,360px);color:#dff2ff}
  #j-modal input{width:100%;margin:12px 0;padding:11px;border-radius:8px;
    border:1px solid rgba(120,205,255,.3);background:#06101a;color:#dff2ff;
    font-family:ui-monospace,monospace}
  #j-modal .fila{display:flex;gap:10px;justify-content:flex-end}
  .hint{font-size:12.5px;color:#8fb0c4;line-height:1.45}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="ui">
  <div class="top">
    <div id="j-status"><span class="dot"></span><span id="j-status-txt">Desconectado</span></div>
    <button class="btn" id="j-gear" aria-label="Ajustes">&#9881;</button>
  </div>
  <div id="j-bar">
    <button class="btn" id="j-fx">Voz JARVIS</button>
    <button class="btn" id="j-connect">Hablar</button>
  </div>
</div>
<div id="j-modal"><div class="box">
  <div style="font:500 15px system-ui;margin-bottom:5px">Token de JARVIS</div>
  <div class="hint">Token del webhook. Se guarda solo en este dispositivo.</div>
  <input id="j-token" type="password" placeholder="token" autocomplete="off">
  <div class="fila"><button class="btn" id="j-save">Guardar</button></div>
</div></div>

<script>
/* ================= NUCLEO VISUAL (base: maqueta de Francisco) ================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', {alpha:true});
let W,H,DPR,R,RS,RScur,CX,CY,LW;
let fx=null, fy=null;
try{ const g=JSON.parse(localStorage.getItem('jarvis_pos')||'null'); if(g){ fx=g.x; fy=g.y; } }catch(e){}

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 3.5);
  const r = cv.getBoundingClientRect();
  W=r.width; H=r.height;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  R  = Math.min(W,H)*0.115;
  RS = R*0.77; RScur = RS;
  LW = Math.max(0.35, R/330);
  const anillo = R*1.30;
  CX = anillo + W*0.030;
  CY = H - anillo - W*0.030;
  if(fx!==null){ CX=fx*W; CY=fy*H; }
  acotar();
}

function norm(v){const l=Math.hypot(v[0],v[1],v[2]);return [v[0]/l,v[1]/l,v[2]/l];}
function buildIcosphere(sub){
  const t=(1+Math.sqrt(5))/2;
  let verts=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(norm);
  let faces=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const cache={};
  const mid=(a,b)=>{const k=a<b?a+'_'+b:b+'_'+a; if(cache[k]!==undefined) return cache[k];
    const p=norm([(verts[a][0]+verts[b][0])/2,(verts[a][1]+verts[b][1])/2,(verts[a][2]+verts[b][2])/2]);
    verts.push(p); cache[k]=verts.length-1; return cache[k];};
  for(let i=0;i<sub;i++){const nf=[];
    for(const f of faces){const a=mid(f[0],f[1]),b=mid(f[1],f[2]),c2=mid(f[2],f[0]);
      nf.push([f[0],a,c2],[f[1],b,a],[f[2],c2,b],[a,b,c2]);} faces=nf;}
  const seen=new Set(), edges=[];
  for(const f of faces) for(let i=0;i<3;i++){const a=f[i],b=f[(i+1)%3];
    const k=a<b?a+'_'+b:b+'_'+a; if(!seen.has(k)){seen.add(k);edges.push([a,b]);}}
  return {verts,edges};
}
const {verts,edges}=buildIcosphere(2);
const P=verts.map(()=>({x:0,y:0,z:0,s:1}));

const bolts=[];
function nuevoRayo(){return {vi:(Math.random()*verts.length)|0,t:0,dur:0.10+Math.random()*0.24,
  seed:Math.random()*1000,w:0.5+Math.random()*0.8};}
for(let i=0;i<30;i++) bolts.push(nuevoRayo());
const hash=n=>{const x=Math.sin(n)*43758.5453; return x-Math.floor(x);};

/* ---------- paletas / estados ---------- */
const PALETAS={
  azul:{deep:[20,140,235],mid:[70,215,255],hot:[225,252,255],light:[215,250,255],
    core:[90,215,255],core2:[30,150,235],core3:[10,60,150],glow:[40,170,255],glow2:[0,60,160],
    part:[120,225,255],fil:[150,240,255],fil2:[20,120,220],node:[150,240,255],node2:[30,150,255]},
  amarillo:{deep:[205,135,15],mid:[255,205,60],hot:[255,252,225],light:[255,246,205],
    core:[255,205,70],core2:[225,150,20],core3:[120,65,5],glow:[255,180,40],glow2:[95,50,0],
    part:[255,225,130],fil:[255,235,150],fil2:[200,130,20],node:[255,230,140],node2:[230,150,30]},
  rojo:{deep:[205,45,25],mid:[255,95,65],hot:[255,230,220],light:[255,215,200],
    core:[255,90,60],core2:[215,35,20],core3:[95,10,5],glow:[255,70,40],glow2:[85,0,0],
    part:[255,150,120],fil:[255,160,130],fil2:[190,35,20],node:[255,160,130],node2:[220,50,30]}
};
const CLAVES=Object.keys(PALETAS.azul);
const CUR={}; CLAVES.forEach(k=>CUR[k]=PALETAS.azul[k].slice());
let PT=PALETAS.azul;
function mezclarPaleta(dt){const f=Math.min(1,dt*4.5);
  for(const k of CLAVES) for(let i=0;i<3;i++) CUR[k][i]+=(PT[k][i]-CUR[k][i])*f;}
function c(k,a){const v=CUR[k];return 'rgba('+(v[0]|0)+','+(v[1]|0)+','+(v[2]|0)+','+a+')';}
function rgbEsc(k,f){const v=CUR[k];f=f||1;
  return [Math.min(255,Math.round(v[0]*f)),Math.min(255,Math.round(v[1]*f)),Math.min(255,Math.round(v[2]*f))].join(',');}

let J_ESTADO='escuchando';
function setEstadoVisual(e){ if(e===J_ESTADO) return; J_ESTADO=e;
  PT=(e==='problema')?PALETAS.rojo:(e==='ejecutando'?PALETAS.amarillo:PALETAS.azul); }

/* ---------- arrastrar por la pantalla ---------- */
function radioExterno(){ return R*1.30; }
function acotar(){ const m=radioExterno()+W*0.010;
  CX=Math.max(m,Math.min(W-m,CX)); CY=Math.max(m,Math.min(H-m,CY)); }
let arrastre=false,offX=0,offY=0;
function puntero(e){const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};}
cv.addEventListener('pointerdown',e=>{const p=puntero(e);
  if(Math.hypot(p.x-CX,p.y-CY)>radioExterno()*1.3) return;
  arrastre=true;offX=CX-p.x;offY=CY-p.y;
  try{cv.setPointerCapture(e.pointerId);}catch(err){} e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(!arrastre)return;const p=puntero(e);
  CX=p.x+offX; CY=p.y+offY; acotar(); fx=CX/W; fy=CY/H; e.preventDefault();});
function soltar(){ if(!arrastre)return; arrastre=false;
  try{ localStorage.setItem('jarvis_pos',JSON.stringify({x:fx,y:fy})); }catch(e){} }
cv.addEventListener('pointerup',soltar);
cv.addEventListener('pointercancel',soltar);

/* ---------- respiracion ---------- */
let amp=0,mode='listen',modeT=2,syl=0,sylT=0;
function updateAmp(dt,time){
  if(window.__J_amp!=null){ amp += (window.__J_amp-amp)*Math.min(1,14*dt); return; }
  let target; modeT-=dt;
  if(modeT<=0){ if(mode==='listen'){mode='speak';modeT=3+Math.random()*4;}
    else {mode='listen';modeT=2.5+Math.random()*3;} }
  if(mode==='listen'){ target=0.10+0.06*Math.sin(time*1.05)+0.03*Math.sin(time*0.41); }
  else { sylT-=dt; if(sylT<=0){sylT=0.07+Math.random()*0.13;
      syl=Math.random()<0.16?0.04:0.32+Math.random()*0.68;} target=syl; }
  const k=target>amp?14:6; amp+=(target-amp)*Math.min(1,k*dt);
}

const TILT=-0.14,cT=Math.cos(TILT),sT=Math.sin(TILT);
function project(p,ca,sa){
  let x=p[0]*ca+p[2]*sa, z=-p[0]*sa+p[2]*ca; const y=p[1];
  const y2=y*cT-z*sT, z2=y*sT+z*cT, persp=1/(1-z2*0.28);
  return {x:CX+x*RScur*persp, y:CY+y2*RScur*persp, z:z2, s:persp};
}

/* ================= ORGANIGRAMA =================
   nucleo = Francisco · esfera = JARVIS
   anillo 1 = agentes · bloque anillo 2+3 = subagentes + sus tareas
   (los dos ultimos giran juntos, mas lento y en sentido contrario) */
var ORG_CFG={agentes:[
  {nombre:'Arquitecto', subagentes:[
    {nombre:'Diseno',  tareas:['disenar','revisar']},
    {nombre:'Entrega', tareas:['prompt','buzon']}]},
  {nombre:'Constructor', subagentes:[
    {nombre:'Recetas', tareas:['vigilante']}]},
  {nombre:'Control Calidad', subagentes:[
    {nombre:'Pruebas', tareas:['voz','web','memoria']}]},
  {nombre:'Informacion', subagentes:[
    {nombre:'Web',     tareas:['buscar','leer pagina']},
    {nombre:'Memoria', tareas:['guardar','recordar']}]},
  {nombre:'Obsidian', subagentes:[
    {nombre:'Notas',   tareas:['guardar nota','buscar nota']}]}
]};
var ORG_ACTIVOS={};
function orgActivo(n){ return !!ORG_ACTIVOS[n]; }

function drawOrganigrama(pulse,time){
  const ags=(ORG_CFG&&ORG_CFG.agentes)||[]; if(!ags.length) return;
  const TAU=Math.PI*2, pa=TAU/ags.length, g=0.012;
  const s1=[],s2=[],s3=[];
  for(let i=0;i<ags.length;i++){
    const f=0.65+0.35*((ags.length-i)/ags.length);
    s1.push({a0:i*pa+g, a1:(i+1)*pa-g, body:rgbEsc('core2',f), hi:rgbEsc('mid',0.85),
             neon: orgActivo(ags[i].nombre)?rgbEsc('hot',1):null});
    const subs=ags[i].subagentes||[]; if(!subs.length) continue;
    const ps=pa/subs.length;
    for(let j=0;j<subs.length;j++){
      const b0=i*pa+j*ps, f2=0.60+0.40*((subs.length-j)/subs.length);
      s2.push({a0:b0+g*0.8, a1:b0+ps-g*0.8, body:rgbEsc('core3',1.7*f2), hi:rgbEsc('mid',0.70),
               neon: orgActivo(subs[j].nombre)?rgbEsc('hot',1):null});
      const tks=subs[j].tareas||[]; if(!tks.length) continue;
      const pt=ps/tks.length;
      for(let k=0;k<tks.length;k++){
        const t0=b0+k*pt, f3=0.60+0.40*((tks.length-k)/tks.length);
        s3.push({a0:t0+g*0.6, a1:t0+pt-g*0.6, body:rgbEsc('core3',1.25*f3), hi:rgbEsc('mid',0.55),
                 neon: orgActivo(tks[k])?rgbEsc('hot',1):null});
      }
    }
  }
  drawRing(pulse, R*1.050, R*1.155, ringAngle,  rgbEsc('glow',0.85), s1);
  drawRing(pulse, R*1.172, R*1.242, ring2Angle, rgbEsc('glow',0.65), s2);
  drawRing(pulse, R*1.242, R*1.300, ring2Angle, rgbEsc('glow',0.55), s3);
}

/* ================= bucle ================= */
let t0=performance.now(), angle=0, ringAngle=0, ring2Angle=0;
function frame(now){
  const dt=Math.min((now-t0)/1000,0.05); t0=now;
  const time=now/1000;
  angle+=dt*0.32; ringAngle-=dt*0.45; ring2Angle+=dt*0.20;
  updateAmp(dt,time); mezclarPaleta(dt);
  RScur=RS*(1+amp*0.26);
  const ca=Math.cos(angle), sa=Math.sin(angle);
  const pulse=0.80+0.10*Math.sin(time*1.6)+0.04*Math.sin(time*4.3)+amp*0.42;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  for(let i=0;i<verts.length;i++){const q=project(verts[i],ca,sa);
    P[i].x=q.x;P[i].y=q.y;P[i].z=q.z;P[i].s=q.s;}

  drawEdges(-1,pulse);

  const core=ctx.createRadialGradient(CX,CY,0,CX,CY,RScur*1.02);
  core.addColorStop(0,'rgba(255,255,255,'+(0.95*pulse)+')');
  core.addColorStop(0.06,c('light',0.80*pulse));
  core.addColorStop(0.20,c('core',0.42*pulse));
  core.addColorStop(0.48,c('core2',0.20*pulse));
  core.addColorStop(1,c('core3',0));
  ctx.fillStyle=core; ctx.beginPath(); ctx.arc(CX,CY,RScur*1.02,0,6.283); ctx.fill();

  ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,RScur*0.97,0,6.283); ctx.clip();
  for(let i=0;i<7;i++){
    const a=time*(0.18+i*0.05)+i*1.7, rx=RScur*(0.30+0.20*Math.sin(time*0.6+i));
    const cx2=CX+Math.cos(a)*RScur*0.30, cy2=CY+Math.sin(a*1.3)*RScur*0.26;
    const g2=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,rx);
    g2.addColorStop(0,c('fil',0.22)); g2.addColorStop(1,c('fil2',0));
    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(cx2,cy2,rx,0,6.283); ctx.fill();
  }
  ctx.restore();

  drawSol(pulse,time);
  drawRayos(dt,time,pulse);
  drawEdges(1,pulse);

  const halo=ctx.createRadialGradient(CX,CY,RScur*0.9,CX,CY,RScur*1.6);
  halo.addColorStop(0,c('glow',0.16*pulse)); halo.addColorStop(1,c('glow2',0));
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(CX,CY,RScur*1.6,0,6.283); ctx.fill();

  drawOrganigrama(pulse,time);
  requestAnimationFrame(frame);
}

function drawSol(pulse,time){
  const flick=1+0.025*Math.sin(time*17.3)+0.015*Math.sin(time*29.1);
  const r=RScur*0.25*(1+amp*0.12)*flick;
  const cor=ctx.createRadialGradient(CX,CY,r*0.6,CX,CY,r*2.9);
  cor.addColorStop(0,c('light',0.55*pulse)); cor.addColorStop(0.25,c('core',0.34*pulse));
  cor.addColorStop(0.6,c('core2',0.16*pulse)); cor.addColorStop(1,c('core3',0));
  ctx.fillStyle=cor; ctx.beginPath(); ctx.arc(CX,CY,r*2.9,0,6.283); ctx.fill();
  for(let i=0;i<5;i++){
    const a=time*(0.5+i*0.13)+i*1.9, lr=r*(1.15+0.35*Math.sin(time*2.1+i));
    const lx=CX+Math.cos(a)*r*0.55, ly=CY+Math.sin(a)*r*0.55;
    const g=ctx.createRadialGradient(lx,ly,0,lx,ly,lr);
    g.addColorStop(0,c('hot',0.30*pulse)); g.addColorStop(1,c('core2',0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(lx,ly,lr,0,6.283); ctx.fill();
  }
  const d=ctx.createRadialGradient(CX,CY,0,CX,CY,r);
  d.addColorStop(0,'rgba(255,255,255,'+Math.min(1,pulse)+')');
  d.addColorStop(0.55,'rgba(255,255,255,'+(0.92*pulse)+')');
  d.addColorStop(0.82,c('light',0.85*pulse)); d.addColorStop(1,c('mid',0.55*pulse));
  ctx.fillStyle=d; ctx.beginPath(); ctx.arc(CX,CY,r,0,6.283); ctx.fill();
}

function drawRayos(dt,time,pulse){
  const rSol=RScur*0.25*(1+amp*0.12);
  const visible=(window.__J_rayos!==false);
  const activos=visible ? (13+Math.round(amp*14)) : 0;
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(let i=0;i<bolts.length;i++){
    const b=bolts[i]; b.t+=dt;
    if(b.t>b.dur){const n=nuevoRayo();b.vi=n.vi;b.t=0;b.dur=n.dur;b.seed=n.seed;b.w=n.w;}
    if(i>=activos) continue;
    const p=P[b.vi], dx=p.x-CX, dy=p.y-CY, len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len, sx=CX+ux*rSol*0.95, sy=CY+uy*rSol*0.95;
    const depth=(p.z+1)/2, fade=Math.sin(Math.PI*(b.t/b.dur));
    const al=fade*(0.20+depth*0.80)*pulse; if(al<=0.01) continue;
    const N=11, pts=[];
    for(let k=0;k<=N;k++){const u=k/N;
      const bx=sx+(p.x-sx)*u, by=sy+(p.y-sy)*u;
      const j=(hash(b.seed+k*7.13)*2-1)*0.75+Math.sin(time*38+b.seed+k*1.7)*0.35;
      const w=j*Math.sin(Math.PI*u)*len*0.13;
      pts.push([bx-uy*w, by+ux*w]);}
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(let k=1;k<pts.length;k++) ctx.lineTo(pts[k][0],pts[k][1]);
    const bw=b.w;
    ctx.strokeStyle=c('deep',al*0.26); ctx.lineWidth=6.0*bw*p.s*LW; ctx.stroke();
    ctx.strokeStyle=c('mid',al*0.52);  ctx.lineWidth=2.3*bw*p.s*LW; ctx.stroke();
    ctx.strokeStyle=c('hot',al*0.95);  ctx.lineWidth=0.95*bw*p.s*LW; ctx.stroke();
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,9*p.s*LW);
    g.addColorStop(0,'rgba(255,255,255,'+(al*0.85*b.w)+')'); g.addColorStop(1,c('mid',0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,9*p.s*LW,0,6.283); ctx.fill();
  }
}

function drawEdges(side,pulse){
  ctx.lineCap='round';
  for(const [ia,ib] of edges){
    const a=P[ia],b=P[ib],zm=(a.z+b.z)/2;
    if(side>0?zm<0:zm>=0) continue;
    const depth=(zm+1)/2, al=(0.10+depth*depth*0.80)*pulse;
    ctx.strokeStyle=c('deep',al*0.16); ctx.lineWidth=5.5*a.s*LW;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.strokeStyle=c('mid',al*0.40); ctx.lineWidth=2.1*a.s*LW;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.strokeStyle=c('hot',al*0.85); ctx.lineWidth=0.8*a.s*LW;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  for(const p of P){
    if(side>0?p.z<0:p.z>=0) continue;
    const depth=(p.z+1)/2, al=(0.12+depth*depth*0.88)*pulse, r=(1.0+depth*2.1)*p.s*LW;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*4);
    g.addColorStop(0,'rgba(255,255,255,'+al+')');
    g.addColorStop(0.25,c('node',al*0.55)); g.addColorStop(1,c('node2',0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,r*4,0,6.283); ctx.fill();
  }
}

function sombra(rgb,f){const v=rgb.split(',').map(Number);
  return 'rgb('+v.map(x=>Math.max(0,Math.min(255,Math.round(x*f)))).join(',')+')';}

function drawRing(pulse,rIn,rOut,spin,glow,segs){
  const rMid=(rIn+rOut)/2, band=rOut-rIn, cx=CX, cy=CY;
  ctx.lineCap='butt';
  const g=ctx.createRadialGradient(cx,cy,rIn*0.94,cx,cy,rOut*1.08);
  g.addColorStop(0,'rgba('+glow+',0)');
  g.addColorStop(0.5,'rgba('+glow+','+(0.24*pulse)+')');
  g.addColorStop(1,'rgba('+glow+',0)');
  ctx.fillStyle=g; ctx.beginPath();
  ctx.arc(cx,cy,rOut*1.08,0,6.283); ctx.arc(cx,cy,rIn*0.94,0,6.283,true); ctx.fill();

  ctx.globalCompositeOperation='source-over';
  for(const s of segs){
    const w=band*(s.t||1), a0=spin+s.a0, a1=spin+s.a1;
    const tubo=ctx.createRadialGradient(cx,cy,rMid-w/2,cx,cy,rMid+w/2);
    tubo.addColorStop(0,sombra(s.body,0.30)); tubo.addColorStop(0.16,sombra(s.body,0.80));
    tubo.addColorStop(0.36,sombra(s.body,1.75)); tubo.addColorStop(0.55,sombra(s.body,1.15));
    tubo.addColorStop(0.80,sombra(s.body,0.50)); tubo.addColorStop(1,sombra(s.body,0.24));
    ctx.strokeStyle=tubo; ctx.lineWidth=w;
    ctx.beginPath(); ctx.arc(cx,cy,rMid,a0,a1); ctx.stroke();
    ctx.strokeStyle=sombra(s.hi,0.9); ctx.lineWidth=Math.max(0.6,1.1*LW);
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a0)*(rMid-w/2), cy+Math.sin(a0)*(rMid-w/2));
    ctx.lineTo(cx+Math.cos(a0)*(rMid+w/2), cy+Math.sin(a0)*(rMid+w/2));
    ctx.stroke();
  }

  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,rOut,0,6.283); ctx.arc(cx,cy,rIn,0,6.283,true); ctx.clip();
  const luz=ctx.createLinearGradient(cx-rOut,cy-rOut,cx+rOut,cy+rOut);
  luz.addColorStop(0,'rgba(255,255,255,0.26)'); luz.addColorStop(0.38,'rgba(255,255,255,0.04)');
  luz.addColorStop(0.55,'rgba(0,0,0,0.12)');    luz.addColorStop(1,'rgba(0,0,0,0.50)');
  ctx.fillStyle=luz; ctx.fillRect(cx-rOut,cy-rOut,rOut*2,rOut*2);
  ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=band*0.20;
  ctx.beginPath(); ctx.arc(cx,cy,rMid-band*0.14,-2.75,-0.55); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.30)'; ctx.lineWidth=band*0.08;
  ctx.beginPath(); ctx.arc(cx,cy,rMid-band*0.14,-2.55,-0.85); ctx.stroke();
  ctx.restore();

  const par=0.88+0.12*Math.sin(performance.now()/1000*8.5+rIn*0.05);
  for(const s of segs){
    if(!s.neon) continue;
    const w=band*(s.t||1), a0=spin+s.a0, a1=spin+s.a1;
    ctx.globalCompositeOperation='lighter'; ctx.lineCap='butt';
    const capas=[[2.9,0.09],[1.9,0.16],[1.15,0.30],[0.75,0.55]];
    for(const cp of capas){
      ctx.strokeStyle='rgba('+s.neon+','+(cp[1]*par)+')'; ctx.lineWidth=w*cp[0];
      ctx.beginPath(); ctx.arc(cx,cy,rMid,a0,a1); ctx.stroke();
    }
    ctx.strokeStyle='rgba(255,255,255,'+(0.85*par)+')';
    ctx.lineWidth=Math.max(1,w*0.26);
    ctx.beginPath(); ctx.arc(cx,cy,rMid,a0,a1); ctx.stroke();
  }
  ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle='rgba(160,215,255,'+(0.28*pulse)+')'; ctx.lineWidth=Math.max(0.6,1.1*LW);
  ctx.beginPath(); ctx.arc(cx,cy,rIn+0.6,0,6.283); ctx.stroke();
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.lineWidth=Math.max(0.7,1.4*LW);
  ctx.beginPath(); ctx.arc(cx,cy,rOut-0.7,0,6.283); ctx.stroke();
  ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
}

/* ================= CAPA DE APP (conexion + voz + memoria) ================= */
(function(){
  var WEBHOOK="https://n8n-1iul.srv1807401.hstgr.cloud/webhook/jarvis";
  var WEBHOOK_MEM="https://n8n-1iul.srv1807401.hstgr.cloud/webhook/jarvis-memoria-guardar";
  var $=function(id){return document.getElementById(id);};
  var stx=$('j-status-txt'), sel=$('j-status');
  var ws=null, AC=null, connected=false, fxOn=true;
  var fxIn=null, master=null, outAnalyser=null, ob=null;
  var micStream=null, micSrc=null, micNode=null, micAnalyser=null, mb=null;
  var scheduled=[], nextStart=0, transcript=[];
  var problema=false, demoOn=false;
  /* estado por EVENTOS (no por nivel de audio):
     amarillo desde que Francisco termina de hablar (JARVIS piensa/busca/responde)
     hasta que termina de decir su respuesta. Celeste el resto del tiempo. */
  var trabajando=false, ultimoChunk=0, trabajandoDesde=0;
  /* modo mute: al decir "mute/silencio" JARVIS se calla hasta que digas "Jarvis" */
  var muteVoz=false;

  function setStatus(t,on){ stx.textContent=t; sel.classList.toggle('on',!!on); }
  function getToken(){ return (localStorage.getItem('jarvis_token')||'').replace(/^Bearer\s+/i,''); }
  $('j-gear').onclick=function(){ $('j-token').value=getToken(); $('j-modal').classList.add('show'); };
  $('j-save').onclick=function(){ localStorage.setItem('jarvis_token',$('j-token').value.trim());
    $('j-modal').classList.remove('show'); setStatus('Token guardado'); };
  $('j-modal').onclick=function(e){ if(e.target===$('j-modal')) $('j-modal').classList.remove('show'); };
  $('j-fx').onclick=function(){ fxOn=!fxOn; $('j-fx').classList.toggle('off',!fxOn); };

  function toast(msg){ try{ var el=document.createElement('div'); el.textContent=msg;
    el.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);'+
      'background:rgba(8,40,90,.85);color:#9fdcff;border:1px solid rgba(120,205,255,.5);'+
      'border-radius:999px;padding:8px 16px;font:500 12px/1 ui-monospace,monospace;z-index:50';
    document.body.appendChild(el); setTimeout(function(){ if(el.remove) el.remove(); },2500);
  }catch(e){} }

  function dB(v){ return Math.pow(10,v/20); }
  function makeIR(a,sec,decay){ var r=a.sampleRate,len=Math.floor(r*sec),ir=a.createBuffer(2,len,r);
    for(var ch=0;ch<2;ch++){var d=ir.getChannelData(ch);
      for(var i=0;i<len;i++){var t=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-t,decay);}} return ir; }
  function buildChain(a){
    var input=a.createGain();
    var hp=a.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=110; hp.Q.value=0.7;
    var p1=a.createBiquadFilter(); p1.type='peaking'; p1.frequency.value=4000; p1.Q.value=1.0; p1.gain.value=4;
    var p2=a.createBiquadFilter(); p2.type='peaking'; p2.frequency.value=8500; p2.Q.value=1.2; p2.gain.value=2;
    var comp=a.createDynamicsCompressor(); comp.threshold.value=-14; comp.knee.value=3;
    comp.ratio.value=4; comp.attack.value=0.1; comp.release.value=1.0;
    var makeup=a.createGain(); makeup.gain.value=dB(6);
    var haasOut=a.createGain();
    var panL=a.createStereoPanner(); panL.pan.value=-1;
    var delayR=a.createDelay(0.1); delayR.delayTime.value=0.015;
    var panR=a.createStereoPanner(); panR.pan.value=1;
    var echoDelay=a.createDelay(0.5); echoDelay.delayTime.value=0.020;
    var echoFb=a.createGain(); echoFb.gain.value=0.2;
    var echoWet=a.createGain(); echoWet.gain.value=0.2;
    var conv=a.createConvolver(); conv.buffer=makeIR(a,0.6,2.5);
    var revWet=a.createGain(); revWet.gain.value=dB(-12);
    var dry=a.createGain(); dry.gain.value=1.0;
    var m=a.createGain(); m.gain.value=1.0;
    input.connect(hp); hp.connect(p1); p1.connect(p2); p2.connect(comp); comp.connect(makeup);
    makeup.connect(panL); panL.connect(haasOut);
    makeup.connect(delayR); delayR.connect(panR); panR.connect(haasOut);
    haasOut.connect(dry); dry.connect(m);
    haasOut.connect(echoDelay); echoDelay.connect(echoFb); echoFb.connect(echoDelay);
    echoDelay.connect(echoWet); echoWet.connect(m);
    haasOut.connect(conv); conv.connect(revWet); revWet.connect(m);
    fxIn=input; master=m;
  }
  function rms(buf){var s=0;for(var i=0;i<buf.length;i++){var v=(buf[i]-128)/128;s+=v*v;}
    return Math.sqrt(s/buf.length);}

  function pump(){
    if(connected){
      var out=0,mic=0;
      if(outAnalyser){outAnalyser.getByteTimeDomainData(ob);out=rms(ob);}
      if(micAnalyser){micAnalyser.getByteTimeDomainData(mb);mic=rms(mb);}
      /* ¿termino de responder? cola vacia + sin chunks nuevos por un rato */
      if(trabajando && ultimoChunk && AC && AC.currentTime>nextStart &&
         (Date.now()-ultimoChunk)>700){ trabajando=false; ultimoChunk=0; }
      /* salvaguarda: si penso y nunca llego audio, no se queda amarillo para siempre */
      if(trabajando && !ultimoChunk && (Date.now()-trabajandoDesde)>20000) trabajando=false;
      if(!demoOn) setEstadoVisual(problema?'problema':(trabajando?'ejecutando':'escuchando'));
      window.__J_rayos=!trabajando;                  // rayos solo mientras te escucha
      window.__J_amp=Math.min(1,(trabajando?out:mic)*4.0);
    } else {
      window.__J_amp=null; window.__J_rayos=true;
      if(!demoOn) setEstadoVisual(problema?'problema':'escuchando');
    }
    requestAnimationFrame(pump);
  }

  function b64ToF32(b64){var bin=atob(b64),len=bin.length,u8=new Uint8Array(len);
    for(var i=0;i<len;i++)u8[i]=bin.charCodeAt(i);
    var n=Math.floor(len/2),i16=new Int16Array(u8.buffer,0,n),f=new Float32Array(n);
    for(var j=0;j<n;j++)f[j]=i16[j]/32768; return f;}
  function u8ToB64(u8){var s='',CH=0x8000;
    for(var i=0;i<u8.length;i+=CH){s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));} return btoa(s);}
  function f32ToB64(f){var i16=new Int16Array(f.length);
    for(var i=0;i<f.length;i++){var s=Math.max(-1,Math.min(1,f[i])); i16[i]=s<0?s*0x8000:s*0x7FFF;}
    return u8ToB64(new Uint8Array(i16.buffer));}
  function downTo16k(f,inRate){ if(inRate===16000) return f;
    var ratio=inRate/16000,outLen=Math.round(f.length/ratio),out=new Float32Array(outLen);
    for(var i=0;i<outLen;i++){var a=Math.floor(i*ratio),b=Math.floor((i+1)*ratio),sum=0,n=0;
      for(var j=a;j<b&&j<f.length;j++){sum+=f[j];n++;} out[i]=n?sum/n:(f[a]||0);} return out;}

  function playChunk(f32){
    if(!AC) return;
    var buf=AC.createBuffer(1,f32.length,16000); buf.getChannelData(0).set(f32);
    var s=AC.createBufferSource(); s.buffer=buf; s.connect(fxOn?fxIn:master);
    var t=Math.max(AC.currentTime+0.03,nextStart); s.start(t); nextStart=t+buf.duration;
    scheduled.push(s); s.onended=function(){var k=scheduled.indexOf(s); if(k>=0) scheduled.splice(k,1);};
  }
  function stopPlayback(){ for(var i=0;i<scheduled.length;i++){try{scheduled[i].stop();}catch(e){}}
    scheduled=[]; nextStart=0; }

  function saveMemory(){
    if(!transcript.length) return;
    var t=getToken(); if(!t){ transcript=[]; return; }
    var payload=JSON.stringify({transcript:transcript});
    try{ fetch(WEBHOOK_MEM+'?t='+encodeURIComponent(t),{method:'POST',
      headers:{'Content-Type':'application/json'},body:payload,keepalive:true})
      .then(function(){toast('memoria guardada');}).catch(function(){}); }catch(e){}
    transcript=[];
  }

  async function startMic(){
    try{
      micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,
        noiseSuppression:true,autoGainControl:true}});
      micSrc=AC.createMediaStreamSource(micStream);
      micAnalyser=AC.createAnalyser(); micAnalyser.fftSize=1024;
      mb=new Uint8Array(micAnalyser.fftSize); micSrc.connect(micAnalyser);
      var sp=AC.createScriptProcessor(4096,1,1);
      sp.onaudioprocess=function(e){ if(!ws||ws.readyState!==1) return;
        var ds=downTo16k(e.inputBuffer.getChannelData(0),AC.sampleRate);
        try{ ws.send(JSON.stringify({user_audio_chunk:f32ToB64(ds)})); }catch(err){} };
      micSrc.connect(sp); var z=AC.createGain(); z.gain.value=0; sp.connect(z);
      z.connect(AC.destination); micNode=sp;
    }catch(e){ setStatus('Sin microfono'); }
  }
  function stopMic(){ try{ if(micNode) micNode.disconnect(); }catch(e){}
    if(micStream){ micStream.getTracks().forEach(function(t){t.stop();}); micStream=null; }
    micAnalyser=null; }

  async function connect(){
    var token=getToken();
    if(!token){ $('j-modal').classList.add('show'); setStatus('Falta el token'); return false; }
    try{
      setStatus('Conectando...');
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended') AC.resume();
      if(!master){ buildChain(AC); outAnalyser=AC.createAnalyser(); outAnalyser.fftSize=1024;
        ob=new Uint8Array(outAnalyser.fftSize); master.connect(outAnalyser);
        outAnalyser.connect(AC.destination); }
      var r=await fetch(WEBHOOK,{method:'POST',headers:{'Authorization':'Bearer '+token,
        'Content-Type':'application/json'},body:JSON.stringify({accion:'iniciar_sesion'})});
      if(!r.ok){ setStatus('Webhook error '+r.status); return false; }
      var data=await r.json(); if(!data.signed_url){ setStatus('Sin URL firmada'); return false; }
      setStatus('Abriendo voz...');
      ws=new WebSocket(data.signed_url);
      ws.onopen=function(){ setStatus('Enlazando...'); };
      ws.onmessage=function(ev){
        var m; try{m=JSON.parse(ev.data);}catch(e){return;}
        if(m.type==='conversation_initiation_metadata'){ connected=true; setStatus('Conectado',true); startMic(); }
        else if(m.type==='ping'){ try{ws.send(JSON.stringify({type:'pong',
          event_id:(m.ping_event||{}).event_id}));}catch(e){} }
        else if(m.type==='audio'){ var b=(m.audio_event||{}).audio_base_64;
          if(b && !muteVoz){ ultimoChunk=Date.now(); trabajando=true; playChunk(b64ToF32(b)); } }
        else if(m.type==='interruption'){ stopPlayback(); trabajando=false; ultimoChunk=0; }
        else if(m.type==='user_transcript'){ var ut=(m.user_transcription_event||{}).user_transcript;
          if(ut&&ut.trim()&&ut.trim()!=='...'){ transcript.push({role:'usuario',text:ut});
            var low=ut.toLowerCase();
            if(!muteVoz && /(^|\s)(mute|muteate|mutear|silencio)(\s|\.|,|$)/.test(low)){
              muteVoz=true; stopPlayback(); trabajando=false; ultimoChunk=0;
              setStatus('Silenciado',false); toast('JARVIS en silencio - di "Jarvis" para reactivar'); }
            else if(muteVoz && /(^|\s)jarvis(\s|\.|,|!|\?|$)/.test(low)){
              muteVoz=false; setStatus('Conectado',true); toast('JARVIS activo'); }
            else if(!muteVoz){ trabajando=true; ultimoChunk=0; trabajandoDesde=Date.now(); } } }   /* terminaste de hablar -> JARVIS piensa */
        else if(m.type==='agent_response'){ var ar=(m.agent_response_event||{}).agent_response;
          if(ar&&ar.trim()) transcript.push({role:'jarvis',text:ar}); }
      };
      ws.onerror=function(){ setStatus('Error de conexion'); problema=true;
        setTimeout(function(){problema=false;},6000); };
      ws.onclose=function(){ connected=false; trabajando=false; ultimoChunk=0; muteVoz=false;
        stopPlayback(); stopMic(); saveMemory();
        setStatus('Desconectado'); ws=null; $('j-connect').textContent='Hablar'; };
      return true;
    }catch(e){ setStatus('Error: '+e.message); return false; }
  }
  function disconnect(){ connected=false; stopPlayback(); stopMic(); saveMemory();
    if(ws){try{ws.close();}catch(e){} ws=null;} setStatus('Desconectado'); }

  $('j-connect').onclick=async function(){
    if(ws){ disconnect(); $('j-connect').textContent='Hablar'; }
    else { $('j-connect').textContent='Cortar'; var ok=await connect();
      if(!ok) $('j-connect').textContent='Hablar'; }
  };
  window.addEventListener('beforeunload',saveMemory);

  window.JARVIS={
    org:function(cfg){ if(cfg){ORG_CFG=cfg;} return ORG_CFG; },
    activar:function(n,v){ ORG_ACTIVOS[n]=(v!==false); },
    apagar:function(n){ delete ORG_ACTIVOS[n]; },
    limpiar:function(){ ORG_ACTIVOS={}; },
    problema:function(v){ problema=(v!==false); },
    estado:function(e){ if(e) setEstadoVisual(e); return J_ESTADO; },
    posicion:function(x,y){ if(x!=null){ fx=x; fy=y; resize();
      try{localStorage.setItem('jarvis_pos',JSON.stringify({x:fx,y:fy}));}catch(e){} }
      return {x:fx,y:fy}; }
  };

  if(location.search.indexOf('demo=1')>=0){
    demoOn=true;
    var pasos=[
      function(){ ORG_ACTIVOS={}; setEstadoVisual('escuchando'); },
      function(){ ORG_ACTIVOS={'Arquitecto':1,'Diseno':1,'disenar':1}; setEstadoVisual('ejecutando'); },
      function(){ ORG_ACTIVOS={'Informacion':1,'Web':1,'buscar':1,'Memoria':1,'recordar':1};
        setEstadoVisual('ejecutando'); },
      function(){ ORG_ACTIVOS={'Control Calidad':1,'Pruebas':1,'voz':1}; setEstadoVisual('problema'); }
    ];
    var di=0; pasos[0]();
    setInterval(function(){ di++; pasos[di%pasos.length](); },4500);
  }
  requestAnimationFrame(pump);
})();
